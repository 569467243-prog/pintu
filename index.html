.win{position:absolute;inset:0;background:rgba(255,255,255,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;z-index:5}

const EMPTY=8,SOL=[0,1,2,3,4,5,6,7,EMPTY];
let state=[],imgURL=null,moves=0,tileEls=[],boardEl,emptyEl;
const scr=document.getElementById('scr');
function square(url){return new Promise(res=>{const im=new Image();im.onload=()=>{
 const c=document.createElement('canvas');c.width=c.height=900;const x=c.getContext('2d');
 const s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,900,900);
 res(c.toDataURL('image/jpeg',0.85));};im.src=url;});}
function init(dataURL){imgURL=dataURL;state=SOL.slice();moves=0;
 for(let k=0;k<150;k++){const adj=adjOf(state.indexOf(EMPTY));swap(state.indexOf(EMPTY),adj[Math.floor(Math.random()*adj.length)]);}
 renderScreen();render();}
function adjOf(i){const r=Math.floor(i/3),c=i%3,a=[];if(r>0)a.push(i-3);if(r<2)a.push(i+3);if(c>0)a.push(i-1);if(c<2)a.push(i+1);return a;}
function swap(a,b){const t=state[a];state[a]=state[b];state[b]=t;}
function home(){
 scr.innerHTML='<div style="text-align:center;padding:48px 16px">'
 +'<div style="font-size:28px;font-weight:500;margin-bottom:8px">拼图挑战</div>'
 +'<div style="color:#888;font-size:14px;margin-bottom:24px">九宫格拼图 · 点击空格旁的拼块滑动<br>把照片恢复原样即挑战成功</div>'
 +'<button class="primary" onclick="startDefault()">开始挑战</button></div>';}
function startDefault(){init(EMBED);}
function renderScreen(){
 scr.innerHTML='<div class="bar"><span>步数：<b id="mv">0</b></span>'
 +'<span><button class="ghost" onclick="re()">重新打乱</button> <button class="ghost" onclick="home()">返回首页</button></span></div>'
 +'<div id="board"></div>';
 boardEl=document.getElementById('board');
 emptyEl=document.createElement('div');emptyEl.className='empty';boardEl.appendChild(emptyEl);
 tileEls=[];
 for(let p=0;p<8;p++){const d=document.createElement('div');d.className='tile';
  d.style.backgroundImage='url('+imgURL+')';d.style.backgroundSize='300% 300%';
  d.style.backgroundPosition=(p%3)*50+'% '+Math.floor(p/3)*50+'%';
  d.onclick=()=>onTile(p);boardEl.appendChild(d);tileEls.push(d);}}
function re(){init(imgURL);}
function render(){const cs=boardEl.clientWidth/3,sz=cs-4;
 for(let i=0;i<9;i++){const p=state[i],r=Math.floor(i/3),c=i%3,x=c*cs+2,y=r*cs+2;
  if(p===EMPTY){emptyEl.style.width=sz+'px';emptyEl.style.height=sz+'px';emptyEl.style.transform='translate('+x+'px,'+y+'px)';}
  else{const d=tileEls[p];d.style.width=sz+'px';d.style.height=sz+'px';d.style.transform='translate('+x+'px,'+y+'px)';}}}
function onTile(p){const e=state.indexOf(EMPTY),i=state.indexOf(p);
 if(adjOf(e).indexOf(i)<0)return;
 swap(e,i);moves++;document.getElementById('mv').textContent=moves;render();
 if(state.every((v,idx)=>v===SOL[idx]))win();}
function win(){const d=document.createElement('div');d.className='win';
 d.innerHTML='<div style="font-size:26px;font-weight:500;margin-bottom:8px">拼图完成！</div>'
 +'<div style="color:#888;margin-bottom:20px">共用 '+moves+' 步</div>'
 +'<button class="primary" onclick="re()">再来一局</button>';
 boardEl.appendChild(d);}
window.addEventListener('resize',()=>{if(boardEl)render();});
home();
</script></body></html>
